 
<!DOCTYPE html>
<html>
<head>
    <title>I Love Varsha</title>
    <meta charset="UTF-8">
<style>
    body {
     background-color:lightblue;
     text-align: center;
     font-family: Arial, sans-serif;
     padding: 30px;
}
h1 {
   color: darkblue;
   font-size: 42px;
   margin-bottom: 20px;
}
button {
  background-color:darkblue;
  Color:white;
  padding:12px 25px;
  border:none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background-color:blue;
  transform: scale(1.08);
}
img {
    max-width: 100%;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 8px rgba(0,0,0,0.25);
}
.hearts {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 28px;
    animation: float 2s infinite alternate;
}

@keyframes float {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-20px);
    }
}
body.dark {
    background-color: #222;
    color: white;
}

body.dark h1,
body.dark h2 {
    color: white;
}
</style>
</head>

<body>
<button onclick="document.body.classList.toggle('dark')">🌙 Dark Mode</button>
    <h1>Hello Jashu!</h1>
    <img src="WhatsApp Image 2026-06-25 at 12.07.42.jpeg" width="300">
    <p id="message">Idi naa first website.</p>
    <button onclick="document.getElementById('message').innerHTML='Welcome Jashu! 🎉'; this.innerHTML='You Clicked Me! ❤️'">
    Click Me
</button> 
<h2>My To-Do List 📝</h2>
<p id="progress">Completed: 0</p>
<div>
    <h2>Study Timer ⏰</h2>
    <h1 id="timer">25:00</h1>

    <button onclick="startTimer()">Start</button>
    <button onclick="resetTimer()">Reset</button>
</div>

<input type="text" id="taskInput" placeholder="Enter a task">

<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>
   <div class="hearts">
    <span>❤️</span>
    <span>💙</span>
    <span>💜</span>
    <span>❤️</span>
    <span>💙</span>
</div>
<script>
let completedTasks = 0;
window.onload = function() {
    let savedTasks = localStorage.getItem("tasks");

    if (savedTasks) {
        document.getElementById("taskList").innerHTML = savedTasks;
    }

};

function addTask() {
    let task = document.getElementById("taskInput").value;

    if (task !== "") {
        let li = document.createElement("li");

        let taskText = document.createElement("span");
        taskText.innerHTML = "☐ " + task;

        taskText.onclick = function() {
    if (this.innerHTML.startsWith("☐")) {
        this.innerHTML = "✅ " + task;
        completedTasks++;
        document.getElementById("progress").innerHTML =
            "Completed: " + completedTasks;
    }
};

        let deleteButton = document.createElement("button");
        deleteButton.innerHTML = "Delete";
       deleteButton.onclick = function() {
    if (taskText.innerHTML.startsWith("✅")) {
        completedTasks--;
    }

    li.remove();

    document.getElementById("progress").innerHTML =
        "Completed: " + completedTasks;

    localStorage.setItem(
        "tasks",
        document.getElementById("taskList").innerHTML
    );
};

        li.appendChild(taskText);
        li.appendChild(deleteButton);

        document.getElementById("taskList").appendChild(li);
        document.getElementById("taskList").appendChild(li);
localStorage.setItem("tasks", document.getElementById("taskList").innerHTML);
        document.getElementById("taskInput").value = "";
    }
}
let timeLeft = 25 * 60;
let timerInterval;

function startTimer() {
    if (timerInterval) return;

    timerInterval = setInterval(function() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        document.getElementById("timer").innerHTML =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            alert("Study session complete! 🎉");
        }

        timeLeft--;
    }, 1000);
}

function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    timeLeft = 25 * 60;
    document.getElementById("timer").innerHTML = "25:00";
}
</script>
</body>
</html>ok
